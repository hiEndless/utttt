name: event-center-full

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  full-strict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 运行 event_center 全量守卫
        run: bash scripts/check_new_arch_guards.sh --event-center-only --strict-wiring

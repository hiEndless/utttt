name: event-center-full

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  full-strict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python 与依赖
        uses: ./.github/actions/setup-utaker-python
      - name: 运行 event_center 全量守卫
        id: full_guard
        continue-on-error: true
        run: |
          mkdir -p /tmp/event_center_ci
          bash scripts/ci_event_center_full_strict.sh | tee /tmp/event_center_ci/full_guard.log
      - name: 上传失败诊断日志
        if: ${{ steps.full_guard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: event-center-full-diagnostics
          path: /tmp/event_center_ci/
          if-no-files-found: warn
      - name: 失败时终止任务
        if: ${{ steps.full_guard.outcome == 'failure' }}
        run: |
          echo "event_center full guard failed, see uploaded artifact: event-center-full-diagnostics"
          echo "download artifact then run: rg -n \"FAIL_CODE=\" full_guard.log"
          exit 1

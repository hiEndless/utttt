name: event-center-full

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
  push:
    branches:
      - main
    paths:
      - "event_center_new/**"
      - "scripts/check_event_center_*"
      - "tools/local/check_new_arch_guards.sh"
      - "tools/local/check_event_center_ci_doc_snapshot_guard.sh"
      - "tools/local/check_event_center_ci_workflow_guard.sh"
      - "tools/ci/event_center_full_strict.sh"
      - "tools/ci/event_center_emit_meta_header.sh"
      - "tools/ci/event_center_emit_guard_summary.sh"
      - "services/event_center_new/docs/ci.md"
      - "services/event_center_new/docs/ci_help_snapshot_lines.txt"
      - "services/event_center_new/docs/ci_triage_snapshot_lines.txt"
      - "services/event_center_new/docs/ci_help_block_snapshot.txt"
      - "services/event_center_new/docs/ci_baseline_template.md"
      - "docs/ARCHITECTURE_NEW.md"
      - "docs/CONTRACTS_QUICK_REF.md"

jobs:
  full-strict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python 与依赖
        uses: ./.github/actions/setup-utaker-python
      - name: 运行 event_center 全量守卫
        id: full_guard
        continue-on-error: true
        run: |
          mkdir -p /tmp/event_center_ci
          bash tools/ci/event_center_full_strict.sh | tee /tmp/event_center_ci/full_guard.log
          rg -n "^\[CI_GUARD\]" /tmp/event_center_ci/full_guard.log > /tmp/event_center_ci/guard_summary.full.log || true
      - name: 上传失败诊断日志
        if: ${{ steps.full_guard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: event-center-full-diagnostics
          path: /tmp/event_center_ci/
          if-no-files-found: warn
      - name: 失败时终止任务
        if: ${{ steps.full_guard.outcome == 'failure' }}
        run: |
          echo "event_center full guard failed, see uploaded artifact: event-center-full-diagnostics"
          echo "download artifact then run (最短排障命令串):"
          echo "  pwd && ls -la . && rg -n \"FAIL_CODE=\" full_guard.log"
          echo "  rg -n \"^\[CI_GUARD\]\" full_guard.log"
          echo "  cat guard_summary.full.log"
          exit 1

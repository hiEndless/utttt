name: event-center-quick

on:
  pull_request:
    paths:
      - "event_center_new/**"
      - "scripts/check_event_center_*"
      - "tools/local/check_new_arch_guards.sh"
      - "tools/ci/event_center_quick_*.sh"
      - "tools/ci/event_center_emit_meta_header.sh"
      - "tools/ci/event_center_emit_guard_summary.sh"
      - "docs/ARCHITECTURE_NEW.md"
      - "docs/CONTRACTS_QUICK_REF.md"
  push:
    branches:
      - main
    paths:
      - "event_center_new/**"
      - "scripts/check_event_center_*"
      - "tools/local/check_new_arch_guards.sh"
      - "tools/ci/event_center_quick_*.sh"
      - "tools/ci/event_center_emit_meta_header.sh"
      - "tools/ci/event_center_emit_guard_summary.sh"
      - "docs/ARCHITECTURE_NEW.md"
      - "docs/CONTRACTS_QUICK_REF.md"

jobs:
  quick-strict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python 与依赖
        uses: ./.github/actions/setup-utaker-python
      - name: 运行 quick strict 守卫
        id: quick_strict_guard
        continue-on-error: true
        run: |
          mkdir -p /tmp/event_center_ci
          bash tools/ci/event_center_quick_strict.sh | tee /tmp/event_center_ci/quick_strict.log
          rg -n "^\[CI_GUARD\]" /tmp/event_center_ci/quick_strict.log > /tmp/event_center_ci/guard_summary.quick_strict.log || true
      - name: 上传 quick strict 失败诊断日志
        if: ${{ steps.quick_strict_guard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: event-center-quick-strict-diagnostics
          path: /tmp/event_center_ci/
          if-no-files-found: warn
      - name: quick strict 失败时终止任务
        if: ${{ steps.quick_strict_guard.outcome == 'failure' }}
        run: |
          echo "event_center quick strict guard failed, see artifact: event-center-quick-strict-diagnostics"
          echo "download artifact then run (最短排障命令串):"
          echo "  pwd && ls -la . && rg -n \"FAIL_CODE=\" quick_strict.log quick_lenient.log"
          echo "  rg -n \"^\[CI_GUARD\]\" quick_strict.log quick_lenient.log"
          echo "  cat guard_summary.quick_strict.log guard_summary.quick_lenient.log"
          exit 1

  quick-lenient:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python 与依赖
        uses: ./.github/actions/setup-utaker-python
      - name: 运行 quick lenient 守卫
        id: quick_lenient_guard
        continue-on-error: true
        run: |
          mkdir -p /tmp/event_center_ci
          bash tools/ci/event_center_quick_lenient.sh | tee /tmp/event_center_ci/quick_lenient.log
          rg -n "^\[CI_GUARD\]" /tmp/event_center_ci/quick_lenient.log > /tmp/event_center_ci/guard_summary.quick_lenient.log || true
      - name: 上传 quick lenient 失败诊断日志
        if: ${{ steps.quick_lenient_guard.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: event-center-quick-lenient-diagnostics
          path: /tmp/event_center_ci/
          if-no-files-found: warn
      - name: quick lenient 失败时终止任务
        if: ${{ steps.quick_lenient_guard.outcome == 'failure' }}
        run: |
          echo "event_center quick lenient guard failed, see artifact: event-center-quick-lenient-diagnostics"
          echo "download artifact then run (最短排障命令串):"
          echo "  pwd && ls -la . && rg -n \"FAIL_CODE=\" quick_strict.log quick_lenient.log"
          echo "  rg -n \"^\[CI_GUARD\]\" quick_strict.log quick_lenient.log"
          echo "  cat guard_summary.quick_strict.log guard_summary.quick_lenient.log"
          exit 1

version: 1
updated_at: "2026-03-12"

note: "Phase-2 mapping from legacy script entrypoints to verification layer wrappers."

guards:
  - old: "scripts/check_new_arch_guards.sh"
    new: "verification/guards/new_arch_full.sh"
    status: "mapped"

  - old: "scripts/check_new_arch_guards.sh --event-center-quick"
    new: "verification/guards/new_arch_event_center_quick.sh"
    status: "mapped"

  - old: "scripts/check_contract_docs_index_guard.sh + scripts/check_contract_docs_index_help_snapshot_guard.sh"
    new: "verification/guards/contract_docs_index.sh"
    status: "mapped"

  - old: "scripts/check_state_to_agent_contract_guard.sh"
    new: "verification/guards/state_to_agent.sh"
    status: "mapped"

  - old: "scripts/check_agent_to_execution_guard.sh"
    new: "verification/guards/agent_to_execution.sh"
    status: "mapped"

  - old: "scripts/check_event_center_replay_guard.sh + scripts/check_event_center_replay_summary_schema_guard.sh"
    new: "verification/guards/event_center_replay.sh"
    status: "mapped"

suite_entrypoints:
  - old: "bash scripts/check_new_arch_guards.sh"
    new: "bash verification/run_suite.sh --suite=new_arch_full"

  - old: "bash scripts/check_new_arch_guards.sh --event-center-quick"
    new: "bash verification/run_suite.sh --suite=new_arch_event_center_quick"

  - old: "n/a"
    new: "bash tools/ci/verify_all.sh --quick"

reports:
  - output: "verification/reports/*.json"
    schema: "verification/reports/verification_report.schema.json"
    status: "active"

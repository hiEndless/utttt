version: 1
updated_at: "2026-03-12"

default_suite: "new_arch_full"

suites:
  - id: new_arch_full
    description: "Run full new architecture guard chain."
    command: "bash verification/guards/new_arch_full.sh"

  - id: new_arch_event_center_quick
    description: "Run quick event center guard chain."
    command: "bash verification/guards/new_arch_event_center_quick.sh"

  - id: contract_docs_index
    description: "Validate contract docs index and help snapshots."
    command: "bash verification/guards/contract_docs_index.sh"

  - id: state_to_agent
    description: "Validate market_state_engine -> agent_server_new contract chain."
    command: "bash verification/guards/state_to_agent.sh"

  - id: agent_to_execution
    description: "Validate agent -> execution contract chain."
    command: "bash verification/guards/agent_to_execution.sh"

  - id: event_center_replay
    description: "Validate replay pipeline and summary schema."
    command: "bash verification/guards/event_center_replay.sh"

  - id: quick
    description: "Fast verification baseline for local iteration."
    command: "bash verification/run_suite.sh --suite=quick"

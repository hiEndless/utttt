version: 1
updated_at: "2026-03-12"

fields:
  - name: decision_confidence
    canonical_semantic: "agent decision confidence"
    owner: "execution_service"
    allowed_locations:
      - "services/execution_service/docs/decision_intent.schema.json#/properties/decision_confidence"

  - name: confidence
    canonical_semantic: "deprecated alias of decision_confidence"
    lifecycle: "deprecated"
    owner: "execution_service"
    allowed_locations:
      - "services/execution_service/docs/decision_intent.schema.json#/properties/confidence"

  - name: evidence_confidence
    canonical_semantic: "evidence-level confidence"
    owner: "event_center_new"

  - name: classification_confidence
    canonical_semantic: "classification-stage confidence"
    owner: "event_center_new"

  - name: raw_market_structure
    canonical_semantic: "unfused market structure input"
    owner: "feature_service"

  - name: msl
    canonical_semantic: "fused market state language output"
    owner: "market_state_engine"

  - name: risk_flags
    canonical_semantic: "risk feature tags (multi-label)"
    expected_shape: "array[string]"

  - name: risk_state
    canonical_semantic: "risk state machine value"
    expected_shape: "enum"
    owner: "execution_service"
    allowed_locations:
      - "services/execution_service/docs/risk_state.schema.json#/properties/risk_state"
      - "services/execution_service/docs/decision_state.schema.json#/properties/risk_state"
      - "services/execution_service/docs/execution_signal_result.schema.json#/properties/risk_state"

  - name: ts_ms
    canonical_semantic: "legacy millisecond timestamp alias; prefer event_ts_ms or processed_ts_ms by context"
    expected_shape: "integer"

  - name: event_ts_ms
    canonical_semantic: "event occurrence timestamp in milliseconds"
    expected_shape: "integer"
    owner: "event_center_new"
    allowed_locations:
      - "services/event_center_new/docs/selected_event.schema.json#/properties/event_ts_ms"

  - name: processed_ts_ms
    canonical_semantic: "pipeline processing timestamp in milliseconds"
    expected_shape: "integer"
    owner: "event_center_new"
    allowed_locations:
      - "services/event_center_new/docs/selected_event.schema.json#/properties/processed_ts_ms"

  - name: market_state
    canonical_semantic: "service-local state object; not equivalent to fused MSL conclusion"
    owner: "cross_service"

  - name: risk_bias
    canonical_semantic: "action-level risk preference bias; not market environment bias"
    owner: "execution_service"

  - name: market_risk_state
    canonical_semantic: "market-state risk facet object in MSL output"
    owner: "market_state_engine"
    expected_shape: "object"
    allowed_locations:
      - "services/market_state_engine/docs/msl.schema.json#/properties/market_risk_state"

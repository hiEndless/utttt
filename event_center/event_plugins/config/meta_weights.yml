global:
  trigger_weight: 1
  pattern_weight: 2
  min_strength: 2

  # 新增：方向一致性因子
  direction_bonus: 1.2      # 多插件同方向 → ×1.2
  direction_penalty: 0.7    # 出现冲突 → ×0.7
  conflict_threshold: 0.4    # 冲突比例 > 40% → 视为高冲突

plugins:
  rsi_kdj_combo:
    triggers:
      rsi_rebound: 2
      kdj_cross: 2
      kdj_extreme: 1
      rsi_break_50: 1
      vol_confirm: 1
    patterns:
      rsi_bull_div: 3
      second_bottom: 2
      rsi_stack: 2
      wave_sync_down: 2
      kdj_top_div: 3

  kdj_boll_combo:
    triggers:
      bull_cross_mid: 2
      low_reversal_mid_break: 2
      near_lower_touch: 1
      double_bottom_candidate: 2
      band_narrow: 1
      trend_confirm_up: 2
    patterns:
      near_lower: 2
      band_narrow_pattern: 2
      mid_retest: 2
      double_bottom_confirm: 3

  boll_vol_combo:
    triggers:
      upper_breakout_vol: 3
      lower_breakout_vol: 3
      mid_retest_low_vol: 2
      band_squeeze_atr_up: 2
      band_squeeze_atr_down: 2
      vol_spike: 1
      vol_collapse: 1
      band_squeeze: 1
    patterns: {}

  ema_macd_extended_combo:
    triggers:
      ema_golden_cross: 3
      ema_dead_cross: 3
      macd_hist_turn_positive: 2
      macd_hist_turn_negative: 2
      macd_signal_cross_up: 2
      macd_signal_cross_down: 2
      dif_cross_zero_up: 2
      dif_cross_zero_down: 2
      ema_triple_golden: 3
      ema_triple_dead: 3
      macd_bull_momentum: 2
      macd_bear_momentum: 2
      bullish_divergence: 3
      bearish_divergence: 3
    patterns: {}

  triple_rsi_ema_macd:
    triggers:
      rsi_rebound: 2
      rsi_fall: 2
      ema_golden_cross: 3
      ema_death_cross: 3
      macd_golden_cross: 2
      macd_death_cross: 2
    patterns:
      rsi_bull_div: 3
      macd_bull_div: 3
      rsi_bear_div: 3
      macd_bear_div: 3

  rsi_macd_combo:
    triggers:
      rsi_macd_reversal: 3
      rsi_oversold_macd_zero: 2
      rsi50_macd_zero_break: 2
      rsi_pullback_bull: 1
      rsi_oversold_hist_decay: 1
      rsi_strong_bull: 2
      rsi_macd_reversal_bear: 3
      rsi_overbought_macd_zero: 2
      rsi50_macd_zero_break_bear: 2
      rsi_pullback_bear: 1
      rsi_overbought_hist_decay: 1
      rsi_strong_bear: 2
    patterns:
      rsi_bull_divergence: 3
      macd_bull_divergence: 3
      rsi_bear_divergence: 3
      macd_bear_divergence: 3